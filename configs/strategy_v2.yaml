# Strategy v2 = v1 + data cleaning + offering filter + catalyst tags (US small caps, all sectors)
# All window units are trading days; signals are evaluated after the close and executed at the next day's open.

universe:
  min_price: 1.0                 # Actual close at the time (not split-adjusted)
  min_mcap: 100000000            # $100 million
  max_mcap: 3000000000           # $3 billion
  min_dollar_volume: 2000000     # 20-day average dollar volume (including the surge day)
  dollar_volume_window: 20

surge:                           # Enter the watchlist: meet any one condition
  one_day:
    min_ret: 0.12                # One-day gain ≥ 12%
    min_vol_ratio: 3.0           # and volume ≥ 3x the 50-day average volume
  multi_day:
    window: 5
    min_ret: 0.30                # or 5-day gain ≥ 30%
  vol_avg_window: 50

watch:
  max_days: 90                   # Watch for at most 90 trading days after entering the watchlist
  min_days: 10                   # Watch for at least 10 days before a probe is allowed
  invalidate: pre_surge_close    # Close falls back to the pre-surge price = surge invalidated, removed from the watchlist
  invalidate_buffer: 0.0
  max_attempts: 2                # After a failed probe (surge still valid), can wait for another new high; at most 2 attempts

entry:                           # Probe trigger: after the watch period, close at a "new high since the surge"
  new_high_lookback: since_surge # Compared with the highest close since the surge
  near_high_pct: 0.0             # 0 = must make a new high; 0.05 = within 5% of the high also counts
  min_vol_ratio: 1.5             # Volume ratio on the day
  require_above_ma: 20           # Close above the 20-day moving average
  require_ma_rising: true        # and the 20-day moving average is higher than 5 days ago

market:                          # Market filter (only affects opening new positions)
  enabled: false
  ticker: IWM
  ma: 200                        # Probe only when IWM closes above its 200-day moving average

position:
  probe_size: 0.333              # Probe 1/3
  add_size: 0.667                # Add to full position after validation
  stop_lookback: 10              # Initial stop = lowest low of the last 10 days
  max_stop_pct: 0.15             # but lose at most 15% (stop no lower than entry price × 0.85)
  add_trigger_r: 1.0             # Add once the probe's unrealized gain reaches 1R (on the close)
  probe_max_days: 20             # Exit if the probe does not reach 1R within 20 days (validation failed)
  breakeven_after_add: false     # true = after the add, move the stop up to the probe cost (too tight in the PRME test, easily wicked out intraday)
  trail_ma: 20                   # After the add, exit on a close below the 20-day moving average
  max_hold_days: 120
  slippage: 0.005                # One-way slippage of 0.5% per fill

backtest:
  start: "2019-06-01"
  end: null

clean:                           # Data cleaning: exclude stocks that were not tradable before the surge
  enabled: true
  min_history_days: 120          # Trading days with price data ≥ 120 (skip new listings under half a year old)
  pre_surge_dollar_volume: 1000000   # 20-day average dollar volume before the surge ≥ $1 million
  max_zero_volume_days: 2        # Zero-volume days in the 20 days before the surge ≤ 2
                                 # Also: the 20-day average dollar volume on the probe day must be ≥ universe.min_dollar_volume

filters:
  offering:                      # Offering filter (SEC filings)
    enabled: true
    forms: [424B1, 424B4, 424B5, S-1, S-1/A, F-1, F-1/A]   # Actual issuance / pricing / new issuance registration
    shelf_forms: [S-3, F-3]      # Shelf registration (only "ready to issue")
    include_shelf: false
    lookback_days: 5             # An offering filing within 5 days (calendar days) before the surge day also counts
    during_watch: false          # true = an offering filing during the watch period also invalidates (worse in backtests; by default only around the surge is checked)
    exit_on_offering: false      # true = if an offering filing appears while holding, exit at the next day's open
  catalyst:                      # Exclude by filing category from 3 days before to 1 day after the surge day
    exclude: []                  # Options: offering, earnings, agreement, 13d_stake, reg_fd, other_event, none ...
