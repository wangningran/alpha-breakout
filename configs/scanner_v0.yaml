# Breakout scanner v0 parameters (see STRATEGY.md section 3); later backtest calibration only changes this file.
# All window units are trading days; every "past N days" excludes the signal day.

liquidity:
  min_price: 1.0              # Close > $1 (originally $2, relaxed by the user on 2026-10-10)
  min_dollar_volume: 2000000   # 20-day average dollar volume > $2 million
  dollar_volume_window: 20

consolidation:                # Consolidation base: any one lookback window is enough
  base_lookbacks: [60, 90, 120]
  max_base_range: 0.60        # Upper limit on the base range (high/low - 1)
  vol_window: 20              # 20-day annualized volatility
  vol_rank_lookback: 252      # Compared with the 20-day volatility over the past 252 days
  max_vol_percentile: 0.35    # Volatility percentile ≤ 35% counts as "historically low"
  vol_check: prev_day         # prev_day = check the day before the breakout; min_in_base = lowest percentile over the past vol_check_window days
  vol_check_window: 60

breakout:                     # Either one: break above the base high or above the 52-week high
  use_base_high: true
  use_52w_high: true
  high_lookback: 252
  price_field: High           # Whether the base high / 52-week high uses High or Close

volume:
  avg_window: 50
  min_volume_mult: 3.0        # Volume ≥ 3x the 50-day average volume
  min_close_location: 0.667   # (close-low)/(high-low) ≥ 2/3, close in the top 1/3 of the day's range

relative_strength:
  benchmark: XBI
  window: 20
  min_excess_return: 0.0      # 20-day return - XBI 20-day return > 0
