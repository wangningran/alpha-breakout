# v0b: only one change -- the low-volatility condition goes from "the day before the breakout" to "occurred at some point in the past 60 days".
# Why: in the PRME / SDGR reviews, volatility had already risen in the days before the high-volume breakout, so v0's prev_day check blocked every breakout.
# All other parameters are the same as scanner_v0.yaml; used via scripts/event_study.py --config configs/scanner_v0b.yaml.
liquidity:
  min_price: 1.0
  min_dollar_volume: 2000000
  dollar_volume_window: 20
consolidation:
  base_lookbacks: [60, 90, 120]
  max_base_range: 0.60
  vol_window: 20
  vol_rank_lookback: 252
  max_vol_percentile: 0.35
  vol_check: min_in_base
  vol_check_window: 60
breakout:
  use_base_high: true
  use_52w_high: true
  high_lookback: 252
  price_field: High
volume:
  avg_window: 50
  min_volume_mult: 3.0
  min_close_location: 0.667
relative_strength:
  benchmark: XBI
  window: 20
  min_excess_return: 0.0
